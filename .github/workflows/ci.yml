name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements-dev.txt

      - name: Compile Python
        run: python -m compileall app tests

      - name: Check JavaScript syntax
        run: node --check app/static/app.js

      - name: Check Unix scripts
        if: runner.os != 'Windows'
        run: |
          bash scripts/install.sh --profile recommended --dry-run
          bash start.sh --dry-run

      - name: Check Windows scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\install.ps1 -Profile recommended -DryRun
          powershell -NoProfile -ExecutionPolicy Bypass -File .\start.ps1 -DryRun

      - name: Run tests
        run: python -m pytest
